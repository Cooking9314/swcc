# ---------------------------------------------------------------------------
# ИСКЛЮЧЕНИЯ (легитимное - чтобы не плодить ложные срабатывания)
# ---------------------------------------------------------------------------

[[exclude]]
id = "fabric-loader"
family = "Java Agent"
reason = "Fabric Loader легитимно использует -javaagent."
name_regex = '(?i)^fabric-loader[-_.0-9a-z]*\.jar$'

[[exclude]]
id = "forge-neoforge"
family = "Java Agent"
reason = "Forge/NeoForge легитимно запускаются через агент и подменяют classpath."
name_regex = '(?i)^(forge|neoforge|universal|fmlloadcontroller|securejarhandler)[-_.0-9a-z]*\.jar$'

[[exclude]]
id = "lunar-badlion"
family = "Java Agent"
reason = "Lunar/Badlion/PixelLauncher - легитимные клиентские лаунчеры со своими агентами."
name_regex = '(?i)^(lunarclient|lunar|lunar-|badlion|pixel[-_]?launcher|motlauncher)[-_.0-9a-z]*\.(jar|dll)$'

[[exclude]]
id = "vanilla-natives"
reason = "Нативки LWJGL и звуковой модуль Minecraft."
name_regex = '(?i)^(lwjgl|openal|jinput|asm|commons-|guava|log4j|velocity|brigadier|gson|joml|netty|sqlite|jna)[-_0-9a-z.]*\.(dll|so|dylib)$'

[[exclude]]
