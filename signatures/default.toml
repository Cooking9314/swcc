# ============================================================================
#  Sunrise Worlds Cheats Checker - база сигнатур (умолчанию)
# ============================================================================
#  Встроена в .exe как fallback. Если рядом со swcc.exe лежит файл
#  signatures\custom.toml - он дополняет и переопределяет эту базу, поэтому
#  обновлять сигнатуры можно без перекомпиляции.
#
#  Правила внутри одной сигнатуры работают по ИЛИ: сработало любое - находка.
#  Сработало несколько - уверенность складывается (1 - произведение (1-c)).
#  Исключения ([[exclude]]) гасят находки, если имя/путь файла совпал.
#
#  Поля правила (хотя бы одно обязательно):
#    name_regex         регулярка против ИМЕНИ файла
#    path_regex         регулярка против ОТНОСИТЕЛЬНОГО пути к файлу
#    dir_regex          регулярка против относительного пути к КАТАЛОГУ
#    content_magic      подстроки (в нижнем регистре) в сырых байтах файла.
#                       Работает и внутри .jar: имена записей архива лежат
#                       в нём открытым текстом, даже когда код сжат.
#    jar_entry_regex    регулярка против имён записей внутри архива
#    jar_content_magic  подстроки в РАСПАКОВАННЫХ байтах записей архива
#    text_regex         регулярка против содержимого мелких текстовых файлов
#                       (.json .toml .cfg .conf .ini .txt .yml .properties)
#    log_regex          регулярка только против logs/latest.log
#    sha256             известные "грязные" хэши файлов
#
#  confidence: 0..1 | severity: critical|high|medium|low|info
#  kind: cheat_client|autoclicker|xray|macro|injection|cracked_launcher|
#        grey_helper|config_leftover
# ============================================================================

[meta]
version = "2026.11.06-1"
notes = "Базовая сигнатура. Требует поддержки администратором."

[scan]
# Не обходим: огромные и заведомо легитимные каталоги.
skip_dir_names = ["assets", "libraries", "runtime", "bin", "web", "Hiramods_ArmorAPI"]
# Puu-каталоги нативок LWJGL - там dll легитимны.
skip_path_regex = ['(^|/)[^/]*natives([^/]*)?(/|$)', '(^|/)versions/[^/]+/[^/]+\.jar$']
max_walk_files = 250000
# Файлы больше этого размера не читаем (только метаданные, имя и путь).
max_content_bytes = 33554432
# Сколько распакованных байт архива суммарно проверяем на один архив.
max_archive_scan_bytes = 25165824
# Сколько записей архива разбираем.
max_archive_entries = 4000
# Текстовые файлы больше этого размера текстовыми правилами не проверяем.
max_text_bytes = 2097152

