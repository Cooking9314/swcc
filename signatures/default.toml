[[signature]]
id = "meteor.client"
family = "Meteor Client"
kind = "cheat_client"
severity = "critical"
confidence = 0.95
weight = 60
explain = "Meteor Client - open-source чит-клиент для Fabric. Артефакты сборки, классы и каталог конфига."
verify = "Запросить у игрока этот .jar и сравнить с официальными релизами Meteor - совпадения не будет."
name_regex = '(?i)^meteor[-_ ]?client([-_.0-9a-z]+)?\.jar$'
